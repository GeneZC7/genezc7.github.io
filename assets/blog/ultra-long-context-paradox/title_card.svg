<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f0"/>
      <stop offset="100%" style="stop-color:#eae8e0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)" rx="6"/>

  <!-- Expanding concentric brackets — representing growing context windows -->
  <g transform="translate(240, 90)" opacity="0.06" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round">
    <path d="M-12,-18 C-20,-18 -20,18 -12,18"/>
    <path d="M12,-18 C20,-18 20,18 12,18"/>
    <path d="M-18,-30 C-30,-30 -30,30 -18,30"/>
    <path d="M18,-30 C30,-30 30,30 18,30"/>
    <path d="M-24,-44 C-42,-44 -42,44 -24,44"/>
    <path d="M24,-44 C42,-44 42,44 24,44"/>
    <path d="M-30,-60 C-56,-60 -56,60 -30,60"/>
    <path d="M30,-60 C56,-60 56,60 30,60"/>
  </g>

  <!-- Small arrow hinting at "expansion" -->
  <g transform="translate(240, 90)" opacity="0.08">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#c0392b" stroke-width="1"/>
    <polygon points="6,-2.5 11,0 6,2.5" fill="#c0392b"/>
    <polygon points="-6,-2.5 -11,0 -6,2.5" fill="#c0392b"/>
  </g>

  <!-- Accent bar -->
  <rect x="40" y="52" width="45" height="2.5" fill="url(#accent)" rx="1.25"/>

  <!-- Title -->
  <text x="40" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2c3e50">The Ultra-Long</text>
  <text x="40" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2c3e50">Context Paradox</text>

  <!-- Subtitle -->
  <text x="40" y="126" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#777" font-style="italic">Why we need 1M+ context — not despite</text>
  <text x="40" y="138" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#777" font-style="italic">its problems, but because of them.</text>
</svg>
